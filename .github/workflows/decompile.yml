name: Decompile Granny 2 Rework (Unreal)

# Runs manually (with optional Ghidra exe decompile) or automatically when the zip / this workflow changes.
# The push-back to master uses GITHUB_TOKEN, so it will NOT re-trigger this workflow (no loop).
on:
  workflow_dispatch:
    inputs:
      ghidra_decompile:
        description: 'Also decompile the exe with Ghidra into decompiled/scripts/ (very slow: 1-4+ hours)'
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - 'Granny2Reworked.zip'
      - '.github/workflows/decompile.yml'

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repo with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Install repak (Unreal .pak extractor)
        run: |
          URL=$(curl -s https://api.github.com/repos/trumank/repak/releases/latest | \
            python3 -c "import json,sys; \
            assets=json.load(sys.stdin)['assets']; \
            print([a['browser_download_url'] for a in assets if 'x86_64-unknown-linux-gnu' in a['name'] and a['name'].endswith('.tar.xz')][0])")
          echo "Downloading repak from: $URL"
          mkdir -p /tmp/repak_extract
          curl -sL -o /tmp/repak.tar.xz "$URL"
          tar -xJf /tmp/repak.tar.xz -C /tmp/repak_extract
          find /tmp/repak_extract -type f -name repak -exec install -m 0755 {} /usr/local/bin/repak \;
          repak --version

      - name: Unzip the game build
        run: |
          unzip -q Granny2Reworked.zip -d game
          echo "=== Game layout ==="
          find game -maxdepth 2 -type d | sort

      - name: Extract all .pak files (assets, maps, animations, blueprints)
        run: |
          mkdir -p decompiled/Assets
          n=0
          while IFS= read -r pak; do
            n=$((n+1))
            echo ">> Unpacking: $pak"
            repak unpack "$pak" -o decompiled/Assets
          done < <(find game -name '*.pak')
          echo "Unpacked $n pak file(s)"
          du -sh decompiled/Assets

      - name: Copy game binaries for local analysis
        run: |
          mkdir -p decompiled/Binaries
          find game -type f \( -name '*.exe' -o -name '*.dll' \) -exec cp {} decompiled/Binaries/ \; 2>/dev/null || true
          cp game/G2RRecreated.exe decompiled/ 2>/dev/null || true
          echo "Binaries copied:"
          ls -la decompiled/Binaries | head -20

      - name: Build asset inventory + category indexes
        run: |
          cd decompiled || exit 1
          # Full inventory (authoritative)
          find Assets -type f | sort > AssetList.txt
          echo "Total extracted files: $(wc -l < AssetList.txt)"

          # Category indexes (maps, blueprints/scripts, animations) - no file duplication
          find Assets -type f -name '*.umap' | sort > Maps.txt
          find Assets -type f -name '*.uasset' \
            | grep -iE 'blueprint|/bp_|/bp/|/_c\.uasset|_bp\.uasset' \
            | sort > Blueprints_Scripts.txt
          find Assets -type f -iname '*anim*' | sort > Animations.txt

          echo "Maps:       $(wc -l < Maps.txt)"
          echo "Blueprints: $(wc -l < Blueprints_Scripts.txt)"
          echo "Anims:      $(wc -l < Animations.txt)"
          du -sh Assets Binaries

      - name: Write decompile README
        run: |
          cat > decompiled/README.md <<'EOF'
          # Decompiled output — Granny 2 Rework (Unreal Engine)

          Generated automatically by `.github/workflows/decompile.yml`.

          ## What's here
          - `Assets/` — every file extracted from the game's `.pak` (the whole game content)
          - `Binaries/` — game executables + DLLs for local analysis (Ghidra/IDA/x64dbg)
          - `scripts/` — decompiled C pseudo-code of the game's code (produced by Ghidra; present only when
            the workflow was run with the "ghidra_decompile" input enabled). One `.c` file per function.
          - `AssetList.txt` — full inventory of every extracted file
          - `Maps.txt` — list of level/map files (`.umap`)
          - `Blueprints_Scripts.txt` — list of Blueprint assets (empty: this game has no Blueprints)
          - `Animations.txt` — list of animation-related assets

          ## Notes
          - This is an **Unreal Engine** build (not Unity): there is no managed C# to decompile.
          - The game's logic is **native C++** compiled into `Binaries/G2RRecreated-Win64-Shipping.exe`.
            `scripts/` contains Ghidra's decompiled pseudo-C of that binary (assembly-derived, so it is
            low-level and not a faithful recreation of the original source).
          - The extracted `.uasset`/`.uexp` files contain the level/gameplay data. To view them, open with
            **uAssetGUI**, **FModel**, or load them into the Unreal Editor. Maps are `.umap` files.
          - UnrealPak / repak was used for extraction: run `repak unpack <pak> -o <dir>` to re-extract.

          Generated by GitHub Actions run #$GITHUB_RUN_ID
          EOF

      - name: Decompile exe with Ghidra -> decompiled/scripts/ (optional, streams uploads)
        if: ${{ inputs.ghidra_decompile == 'true' }}
        run: |
          set -e
          EXE="game/Granny2Reworked/G2RRecreated/Binaries/Win64/G2RRecreated-Win64-Shipping.exe"
          test -f "$EXE" || EXE=$(find game -name '*-Shipping.exe' | head -1)
          echo "Decompiling: $EXE"
          mkdir -p decompiled/scripts

          # Download latest Ghidra
          GHIDRA_URL=$(curl -s https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print([a['browser_download_url'] for a in d['assets'] if 'PUBLIC' in a['name'] and a['name'].endswith('.zip')][0])")
          echo "Downloading Ghidra from: $GHIDRA_URL"
          curl -sL -o /tmp/ghidra.zip "$GHIDRA_URL"
          unzip -q /tmp/ghidra.zip -d /opt/ghidra
          GHIDRA_DIR=$(find /opt/ghidra -maxdepth 1 -type d -name 'ghidra_*' | head -1)
          echo "Ghidra at: $GHIDRA_DIR"

          # Ghidra script: decompile every function to its own .c file in decompiled/scripts/
          mkdir -p /tmp/ghidra_scripts
          cat > /tmp/ghidra_scripts/ExportAll.java <<'JAVA'
          import ghidra.app.decompiler.DecompInterface;
          import ghidra.app.decompiler.DecompileResults;
          import ghidra.app.script.GhidraScript;
          import ghidra.program.model.listing.Function;
          import ghidra.program.model.listing.FunctionIterator;
          import java.io.File;
          import java.io.PrintWriter;

          public class ExportAll extends GhidraScript {
              @Override
              public void run() throws Exception {
                  String outDirPath = System.getenv("SCRIPTS_DIR");
                  if (outDirPath == null) { outDirPath = "decompiled/scripts"; }
                  File outDir = new File(outDirPath);
                  outDir.mkdirs();
                  DecompInterface decomp = new DecompInterface();
                  decomp.openProgram(currentProgram);
                  FunctionIterator it = currentProgram.getFunctionManager().getFunctions(true);
                  long total = 0;
                  int count = 0;
                  while (it.hasNext() && !monitor.isCancelled()) {
                      Function f = it.next();
                      total++;
                      DecompileResults res = decomp.decompileFunction(f, 60, monitor);
                      if (res != null && res.decompileCompleted()) {
                          String name = f.getName().replaceAll("[^a-zA-Z0-9_.-]", "_");
                          File out = new File(outDir, name + ".c");
                          PrintWriter pw = new PrintWriter(out);
                          pw.println("// Function: " + f.getName());
                          pw.println("// Address:   " + f.getEntryPoint());
                          pw.println(res.getDecompiledFunction().getC());
                          pw.close();
                          count++;
                          if (count % 200 == 0) { println("Exported " + count + " functions so far"); }
                      }
                  }
                  println("DONE: decompiled " + count + " of " + total + " functions");
                  decomp.dispose();
              }
          }
          JAVA

          # Background watcher: commit + push every new script immediately, every ~30s, while Ghidra runs
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          (
            while true; do
              if git status --porcelain --untracked-files=all decompiled/scripts | grep -q .; then
                git add -A decompiled/scripts
                if ! git diff --cached --quiet; then
                  git commit -q -m "Decompiled scripts (incremental, $(date -u +%H:%M:%S))"
                  git push -q origin master || true
                  echo "[watcher] pushed scripts batch"
                fi
              fi
              sleep 30
            done
          ) &
          WATCHER_PID=$!

          export SCRIPTS_DIR="$PWD/decompiled/scripts"
          mkdir -p /tmp/ghidra_proj
          "$GHIDRA_DIR/support/analyzeHeadless" /tmp/ghidra_proj GameProj \
            -import "$EXE" \
            -scriptPath /tmp/ghidra_scripts \
            -postScript ExportAll.java \
            -deleteProject \
            || true

          kill $WATCHER_PID 2>/dev/null || true
          echo "Ghidra finished. Scripts so far: $(find decompiled/scripts -name '*.c' | wc -l)"

      - name: Handle oversized files (>90 MB) with Git LFS
        run: |
          git lfs install
          BIG=$(find decompiled -type f -size +90M)
          if [ -n "$BIG" ]; then
            echo "$BIG" | while IFS= read -r f; do git lfs track "${f#./}"; done
            echo "Tracked with LFS: $(echo "$BIG" | wc -l) file(s)"
          else
            echo "No files over 90 MB - nothing to LFS-track"
          fi

      - name: Commit and push decompiled output to master
        run: |
          echo "game/" > .gitignore
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit - decompiled output already up to date"
            exit 0
          fi
          git commit -m "Decompiled game output (run $GITHUB_RUN_ID)"
          git push origin master
          echo "Pushed decompiled output to master"